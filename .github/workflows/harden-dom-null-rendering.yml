name: Harden DOM rendering against missing elements
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch startup and render DOM safety
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>\\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\"'\":'&#039;'}[m]));\nfunction toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}"
          new = "const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>\\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\"'\":'&#039;'}[m]));\nfunction setText(id,value){const e=$(id);if(!e){console.warn('DOM element mangler:',id);return false}e.textContent=value??'';return true}\nfunction toast(t){const e=$('toast');if(!e){console.warn('Toast element mangler:',t);return}e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}"
          if old not in s:
              raise SystemExit('Core helper anchor not found')
          s = s.replace(old, new, 1)

          old_render = "function render(){renderMetrics();renderTasks();renderRows();renderKanban();renderOffers();renderCalendar();renderActivity();renderMail();renderApprovals();renderAgents();renderLeadManager();renderIntegrations();renderDashCards();if(typeof renderExecutiveDashboard==='function')renderExecutiveDashboard();}"
          new_render = "function render(){const jobs=[['metrics',renderMetrics],['tasks',renderTasks],['rows',renderRows],['kanban',renderKanban],['offers',renderOffers],['calendar',renderCalendar],['activity',renderActivity],['mail',renderMail],['approvals',renderApprovals],['agents',renderAgents],['leadmanager',renderLeadManager],['integrations',renderIntegrations],['dashcards',renderDashCards]];for(const [name,fn] of jobs){try{fn()}catch(error){console.error('Renderfejl i '+name,error)}}try{if(typeof renderExecutiveDashboard==='function')renderExecutiveDashboard()}catch(error){console.error('Renderfejl i executive dashboard',error)}}"
          if old_render not in s:
              raise SystemExit('render() anchor not found')
          s = s.replace(old_render, new_render, 1)

          replacements = {
            "function showAuth(msg=''){ $('authScreen').classList.remove('hidden');$('appShell').classList.add('hidden');$('authMessage').textContent=msg;}":
            "function showAuth(msg=''){ $('authScreen')?.classList.remove('hidden');$('appShell')?.classList.add('hidden');setText('authMessage',msg);}",
            "function showApp(){ $('authScreen').classList.add('hidden');$('appShell').classList.remove('hidden');$('userEmail').textContent=state.session?.user?.email||''; }":
            "function showApp(){ $('authScreen')?.classList.add('hidden');$('appShell')?.classList.remove('hidden');setText('userEmail',state.session?.user?.email||''); }",
            "$('brandClient').textContent=state.client.name+' · Pilot';":
            "setText('brandClient',state.client.name+' · Pilot');",
            "render();$('syncState').textContent='● Live CRM · '+new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'});":
            "render();setText('syncState','● Live CRM · '+new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}));",
            "$('weekLabel').textContent=`Uge ${new Intl.DateTimeFormat('da-DK',{day:'numeric',month:'short'}).format(days[0])} – ${new Intl.DateTimeFormat('da-DK',{day:'numeric',month:'short',year:'numeric'}).format(days[4])}`;":
            "setText('weekLabel',`Uge ${new Intl.DateTimeFormat('da-DK',{day:'numeric',month:'short'}).format(days[0])} – ${new Intl.DateTimeFormat('da-DK',{day:'numeric',month:'short',year:'numeric'}).format(days[4])}`);",
            "$(b.dataset.view).classList.add('active');$('title').textContent=b.textContent":
            "$(b.dataset.view)?.classList.add('active');setText('title',b.textContent)"
          }
          for a,b in replacements.items():
              if a in s:
                  s = s.replace(a,b,1)

          p.write_text(s, encoding='utf-8')

          test = Path('scripts/test-dom-null-guards.js')
          test.write_text("""const fs=require('fs');\nconst s=fs.readFileSync('index.html','utf8');\nconst must=[\n  "function setText(id,value)",\n  "if(!e){console.warn('Toast element mangler:',t);return}",\n  "console.error('Renderfejl i '+name,error)",\n  "setText('syncState'",\n  "setText('brandClient'",\n  "setText('weekLabel'"\n];\nfor(const x of must){if(!s.includes(x)){console.error('Mangler DOM-guard:',x);process.exit(1)}}\nconsole.log('DOM null-guards OK');\n""",encoding='utf-8')
          PY
      - name: Verify DOM hardening
        run: node scripts/test-dom-null-guards.js
      - name: Commit result
        run: |
          rm .github/workflows/harden-dom-null-rendering.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html scripts/test-dom-null-guards.js .github/workflows/harden-dom-null-rendering.yml
          git commit -m "Harden UI rendering against missing DOM elements"
          git push
