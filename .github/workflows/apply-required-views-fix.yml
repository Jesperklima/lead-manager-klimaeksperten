name: Apply required views fix

on:
  push:
    branches:
      - fix/missing-required-views
    paths:
      - 'scripts/apply-required-views-fix.py'
      - '.github/workflows/apply-required-views-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/missing-required-views
      - name: Apply deterministic patch
        run: python3 scripts/apply-required-views-fix.py
      - name: Verify required DOM and policies
        run: |
          set -euo pipefail
          grep -q 'data-view="offerpipeline"' index.html
          grep -q 'id="offerpipeline"' index.html
          grep -q 'id="offerPipelineBoard"' index.html
          grep -q 'data-view="activityReport"' index.html
          grep -q 'id="activityReport"' index.html
          grep -q 'id="reportLoad"' index.html
          grep -q 'data-report-range="today"' index.html
          grep -q 'data-report-range="week"' index.html
          grep -q 'data-report-range="month"' index.html
          grep -q 'data-report-range="30"' index.html
          grep -q 'lm-report-lazy-guard-v1' index.html
          grep -q 'AI sender aldrig selv' index.html
          ! grep -q 'Godkendt – sendes automatisk' index.html
      - name: Syntax-check restored JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="lm-required-views-v1">(.*?)</script>',s,re.S)
          assert m, 'required views script missing'
          Path('/tmp/required-views.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/required-views.js
      - name: Verify repository integrity
        run: bash scripts/verify-repository-baseline.sh
      - name: Commit verified fix
        run: |
          git add index.html baseline/manifest.json scripts/verify-repository-baseline.sh
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "lead-manager-fix-bot"
          git config user.email "js@klimaeksperten.dk"
          git commit -m "fix: restore offer pipeline and activity report"
          git push origin HEAD:fix/missing-required-views
