name: Fix documented opportunity pipeline column
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function renderKanban(){')
          end=s.index('async function movePipelineLead',start)
          fn='''function renderKanban(){
            const statuses=['NY','UNDER VURDERING','KLAR TIL KONTAKT','I GANG','DIALOG','MØDE','TILBUD','AFVENTER','PÅ PAUSE','VUNDET','TABT','IKKE RELEVANT'];
            const board=$('kanban');
            const oldScroll=board.scrollLeft;
            const poolOf=l=>(l.lead_pool||'standard');
            const card=l=>`<div class="leadcard pipeline-card" draggable="true" data-pipeline-lead="${l.id}" data-open-lead="${l.id}"><strong>${esc(leadName(l))}</strong><small>${esc(l.next_action||'Ingen næste handling')}</small>${l.source_reference?`<small style="margin-top:4px">${esc(l.source_reference)}</small>`:''}${l.manual_lock?'<div class="sub" style="margin-top:5px">🔒 Manuel status</div>':''}</div>`;
            const columns=[];
            const ny=state.leads.filter(l=>poolOf(l)!=='documented_opportunity'&&l.status==='NY');
            columns.push(`<div class="col pipeline-col" data-pipeline-status="NY"><strong>NY</strong><div class="sub">${ny.length} leads</div>${ny.map(card).join('')}</div>`);
            const documented=state.leads.filter(l=>poolOf(l)==='documented_opportunity'&&l.status==='NY');
            columns.push(`<div class="col pipeline-col documented-opportunity-column"><strong>DOKUMENTEREDE MULIGHEDER</strong><div class="sub">${documented.length} muligheder</div>${documented.map(card).join('')}</div>`);
            for(const status of statuses.filter(s=>s!=='NY')){
              const rows=state.leads.filter(l=>l.status===status);
              columns.push(`<div class="col pipeline-col" data-pipeline-status="${esc(status)}"><strong>${esc(status)}</strong><div class="sub">${rows.length} leads</div>${rows.map(card).join('')}</div>`);
            }
            board.innerHTML=columns.join('');
            board.scrollLeft=oldScroll;
            wireLeadButtons();wirePipelineDrag();wirePipelineNavigation();
          }
          '''
          s=s[:start]+fn+s[end:]
          s=re.sub(r'<style id="lm-documented-pipeline-lane-v2">.*?</style>','',s,flags=re.S)
          css='<style id="lm-documented-opportunity-column-v3">.documented-opportunity-column{background:#edf7f3!important}.documented-opportunity-column>strong{color:#147a58!important}.documented-opportunity-column .pipeline-card{border-left:3px solid #14a37f!important}</style>'
          if 'lm-documented-opportunity-column-v3' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit result
        run: |
          rm .github/workflows/fix-documented-opportunity-column.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html .github/workflows/fix-documented-opportunity-column.yml
          git commit -m "Place documented opportunities in one pipeline column"
          git push