name: One-time documented opportunities pipeline patch

on:
  push:
    paths:
      - '.github/workflows/one-time-documented-pool-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split pipeline into standard and documented opportunity pools
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r"function renderKanban\(\)\{.*?\}\nasync function movePipelineLead"
          replacement = r'''function renderKanban(){
            const cols=['NY','UNDER VURDERING','KLAR TIL KONTAKT','I GANG','DIALOG','MØDE','TILBUD','AFVENTER','PÅ PAUSE','VUNDET','TABT','IKKE RELEVANT'];
            const board=$('kanban');
            const oldScroll=board.scrollLeft;
            const poolOf=l=>(l.lead_pool||'standard');
            const card=l=>`<div class="leadcard pipeline-card" draggable="true" data-pipeline-lead="${l.id}" data-open-lead="${l.id}"><strong>${esc(leadName(l))}</strong><small>${esc(l.next_action||'Ingen næste handling')}</small>${l.source_reference?`<small style="margin-top:4px">${esc(l.source_reference)}</small>`:''}${l.manual_lock?'<div class="sub" style="margin-top:5px">🔒 Manuel status</div>':''}</div>`;
            const columns=leads=>cols.map(s=>`<div class="col pipeline-col" data-pipeline-status="${esc(s)}"><strong>${esc(s)}</strong><div class="sub">${leads.filter(x=>x.status===s).length} leads</div>${leads.filter(x=>x.status===s).map(card).join('')}</div>`).join('');
            const standard=state.leads.filter(l=>poolOf(l)!=='documented_opportunity');
            const documented=state.leads.filter(l=>poolOf(l)==='documented_opportunity');
            board.innerHTML=`<div style="display:grid;gap:18px;min-width:max-content">
              <section><div style="display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 2px 8px"><div><strong style="font-size:15px">Normal pipeline</strong><div class="sub">Almindelige leads og den valgte Nye-pulje.</div></div><span class="badge">${standard.length} leads</span></div><div style="display:flex;gap:10px;min-width:max-content">${columns(standard)}</div></section>
              <section><div style="display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 2px 8px"><div><strong style="font-size:15px">Dokumenterede muligheder</strong><div class="sub">Udbud, referater, indkøbsplaner og andre dokumenterede købssignaler. Denne pulje er altid åben og tæller ikke med i den normale leadgrænse.</div></div><span class="badge ok">${documented.length} leads</span></div><div style="display:flex;gap:10px;min-width:max-content">${columns(documented)}</div></section>
            </div>`;
            board.scrollLeft=oldScroll;
            wireLeadButtons();wirePipelineDrag();wirePipelineNavigation();
          }
          async function movePipelineLead'''
          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one renderKanban block, found {n}')
          p.write_text(ns, encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/one-time-documented-pool-patch.yml
          git config user.name "Lead Manager Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/one-time-documented-pool-patch.yml
          git commit -m "Separate documented opportunities from standard lead pipeline"
          git push
