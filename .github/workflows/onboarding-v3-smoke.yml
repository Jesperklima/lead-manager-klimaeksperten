name: Onboarding stability smoke

on:
  push:
    branches:
      - onboarding-v3-stable
      - main
  pull_request:

jobs:
  onboarding-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check saas-onboarding-v5.js
          node --check saas-microsoft-v1.js
      - name: No self-triggering onboarding loops
        shell: bash
        run: |
          if grep -nE 'MutationObserver|setInterval\s*\(' saas-onboarding-v5.js; then
            echo 'Onboarding v5 must remain event-driven: polling/MutationObserver found.' >&2
            exit 1
          fi
      - name: Mail OAuth must remain user-triggered
        shell: bash
        run: |
          grep -q 'async function connectOauth(provider)' saas-onboarding-v5.js
          grep -q "provider==='google'?'gmail-direct-auth':'microsoft-oauth-auth'" saas-onboarding-v5.js
      - name: App loads stable SaaS layers only
        shell: bash
        run: |
          grep -q 'saas-onboarding-v5.js' api/app.js
          grep -q 'saas-mail-providers-v1.js' api/app.js
          if grep -q '<script src="/saas-microsoft-v1.js' api/app.js; then
            echo 'Standalone Microsoft settings UI was reintroduced; unified mail-provider owns Microsoft now.' >&2
            exit 1
          fi
          if grep -nE '<script[^>]+src="/saas-(onboarding-v2|generic-guard|package-guard|admin-invite|microsoft-guard)' api/app.js; then
            echo 'Old SaaS startup layer reintroduced.' >&2
            exit 1
          fi
      - name: Safe access bootstrap ownership remains
        shell: bash
        run: |
          grep -q 'authInit deferred to access-bootstrap-v1.js' api/app.js
          grep -q 'access-bootstrap-v1.js' api/app.js
