name: Patch standard vs documented lead counters
on:
  push:
    paths:
      - '.github/workflows/patch-standard-vs-documented-pool.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch dashboard lead counter
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="al=leads.filter(active),ny=leads.filter(l=>l.status==='NY').length,end=new Date();"
          new="al=leads.filter(active),normalLeads=leads.filter(l=>(l.lead_pool||'standard')!=='documented_opportunity'),ny=normalLeads.filter(l=>l.status==='NY').length,poolTarget=([10,20,30].includes(Number(state?.client?.settings?.new_lead_pool_limit))?Number(state.client.settings.new_lead_pool_limit):10),end=new Date();"
          if old not in s:
              raise SystemExit('NY counter pattern not found')
          s=s.replace(old,new,1)
          old2="w.innerHTML='<div class=\"lm-alert '+(ny>=12?'ok':'')+'\"><strong>NYE leads: '+ny+'</strong> · '+(ny>=12?'Puljen er klar.':'Der skal hele tiden være mindst 12 nye leads klar.')+'</div>"
          new2="w.innerHTML='<div class=\"lm-alert '+(ny>=poolTarget?'ok':'')+'\"><strong>NYE leads: '+ny+' / '+poolTarget+'</strong> · '+(ny>=poolTarget?'Puljen er klar.':'Der skal være '+poolTarget+' almindelige nye leads klar.')+'</div>"
          if old2 not in s:
              raise SystemExit('Alert pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-standard-vs-documented-pool.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-standard-vs-documented-pool.yml
          git commit -m "Keep documented opportunities out of standard lead counter"
          git push