name: Apply quick lead status dropdown

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-quick-lead-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch lead drawer status control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          marker = 'lm-lead-quick-status-v1'
          changed = marker not in html

          if changed:
              needle = '</body></html>'
              if html.count(needle) != 1:
                  raise SystemExit(f'Expected exactly one {needle!r}, found {html.count(needle)}')

              addition = r'''<style id="lm-lead-quick-status-v1-css">
          #lmLeadQuickStatus{margin-top:12px;padding:11px 12px;border:1px solid var(--border);border-radius:13px;background:#f8fafc;box-shadow:var(--shadow)}
          .lm-lead-quick-status-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,.9fr);gap:12px;align-items:center}
          .lm-lead-quick-status-title{font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;color:#64748b}
          .lm-lead-quick-status-copy{font-size:11.5px;color:var(--muted);margin-top:2px}
          #lmLeadStatusSlot .field{margin:0}
          #lmLeadStatusSlot .field label{display:none}
          #lmLeadStatusSlot #dStatus{width:100%;font-weight:800;border-color:#cfd7e5!important;background:#fff!important}
          #lmLeadStatusSlot #dStatus:disabled{opacity:.62;cursor:wait}
          @media(max-width:620px){.lm-lead-quick-status-row{grid-template-columns:1fr}}
          </style>
          <script id="lm-lead-quick-status-v1">
          (()=>{
            const CLOSED_STATUSES=['VUNDET','TABT','IKKE RELEVANT'];
            let statusBusy=false;

            function current(){
              try{return typeof currentLead!=='undefined'?currentLead:null}catch{return null}
            }

            function installQuickStatus(){
              const drawer=document.getElementById('drawer');
              const head=drawer?.querySelector('.drawer-head');
              const select=document.getElementById('dStatus');
              if(!drawer||!head||!select)return;

              let card=document.getElementById('lmLeadQuickStatus');
              if(!card){
                card=document.createElement('div');
                card.id='lmLeadQuickStatus';
                card.innerHTML='<div class="lm-lead-quick-status-row"><div><div class="lm-lead-quick-status-title">Status i pipeline</div><div class="lm-lead-quick-status-copy">Skift status her eller træk kortet i pipeline – begge dele opdaterer samme CRM-status.</div></div><div id="lmLeadStatusSlot"></div></div>';
                head.insertAdjacentElement('afterend',card);
              }

              const slot=document.getElementById('lmLeadStatusSlot');
              const field=select.closest('.field');
              if(slot&&field&&field.parentElement!==slot){
                field.classList.add('lm-lead-quick-status-field');
                slot.appendChild(field);
              }

              if(select.dataset.quickStatusBound!=='1'){
                select.dataset.quickStatusBound='1';
                select.onchange=()=>changeStatusFromDrawer(select.value);
              }
            }

            async function closeOpenTasks(leadId){
              let tasks=[];
              try{tasks=(state?.tasks||[]).filter(t=>t.lead_id===leadId&&t.status==='open')}catch{}
              for(const task of tasks){
                const {error}=await supabase.from('crm_tasks').update({status:'closed',calendar_sync_status:task.external_calendar_id?'delete_pending':'none'}).eq('id',task.id);
                if(error)throw new Error(error.message||'Kunne ikke lukke opfølgningsopgave');
              }
            }

            async function changeStatusFromDrawer(targetStatus){
              if(statusBusy)return;
              const lead=current();
              const select=document.getElementById('dStatus');
              if(!lead?.id||!select)return;
              const previous=lead.status;
              if(!targetStatus||targetStatus===previous){
                try{if(typeof statusExtras==='function')statusExtras()}catch{}
                return;
              }

              let lossReason=lead.loss_reason||null;
              if(targetStatus==='TABT'&&!lossReason){
                const reason=window.prompt('Hvorfor er '+(typeof leadName==='function'?leadName(lead):'leadet')+' tabt?','');
                if(!reason||!reason.trim()){
                  select.value=previous;
                  try{if(typeof statusExtras==='function')statusExtras()}catch{}
                  if(typeof toast==='function')toast('Statusændring annulleret – TABT kræver en årsag');
                  return;
                }
                lossReason=reason.trim();
              }

              statusBusy=true;
              select.disabled=true;
              try{
                const closed=CLOSED_STATUSES.includes(targetStatus);
                const patch={status:targetStatus,manual_lock:true,updated_at:new Date().toISOString()};
                if(targetStatus==='TABT')patch.loss_reason=lossReason;
                else if(previous==='TABT')patch.loss_reason=null;
                if(previous==='VUNDET'&&targetStatus!=='VUNDET')patch.won_value=null;
                if(closed){patch.next_action=null;patch.next_at=null}

                const {error}=await supabase.from('crm_leads').update(patch).eq('id',lead.id);
                if(error)throw new Error(error.message||'Status kunne ikke gemmes');
                if(closed)await closeOpenTasks(lead.id);

                if(typeof logActivity==='function'){
                  await logActivity(lead,'Status',previous+' → '+targetStatus+' (statusmenu)',{
                    previous,
                    next:targetStatus,
                    manual:true,
                    method:'lead_drawer_dropdown',
                    loss_reason:targetStatus==='TABT'?lossReason:null
                  });
                }

                if(typeof loadAll==='function')await loadAll();
                if(typeof openLead==='function')openLead(lead.id);
                if(typeof toast==='function')toast('Status ændret til '+targetStatus);
                if(targetStatus==='MØDE'&&!lead.next_at&&typeof toast==='function'){
                  setTimeout(()=>toast('Møde registreret – angiv dato og tid på leadet'),450);
                }
              }catch(err){
                console.error('quick lead status',err);
                select.value=previous;
                try{if(typeof statusExtras==='function')statusExtras()}catch{}
                if(typeof toast==='function')toast(err?.message||'Status kunne ikke ændres');
              }finally{
                statusBusy=false;
                const currentSelect=document.getElementById('dStatus');
                if(currentSelect)currentSelect.disabled=false;
              }
            }

            installQuickStatus();
            new MutationObserver(()=>installQuickStatus()).observe(document.documentElement,{subtree:true,childList:true});
            document.addEventListener('click',()=>setTimeout(installQuickStatus,0),true);
            setTimeout(installQuickStatus,300);
          })();
          </script>'''

              html = html.replace(needle, addition + '\n' + needle)
              index_path.write_text(html, encoding='utf-8')
          else:
              print('Quick-status marker already present; leaving index.html unchanged.')

          data = index_path.read_bytes()
          new_bytes = len(data)
          new_md5 = hashlib.md5(data).hexdigest()

          manifest_path = Path('baseline/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if changed:
              manifest['previous_repository'] = {
                  'bytes': manifest.get('repository_bytes'),
                  'md5': manifest.get('repository_md5'),
                  'change': manifest.get('change')
              }
              manifest['repository_bytes'] = new_bytes
              manifest['repository_md5'] = new_md5
              manifest['change'] = 'add quick lead status dropdown in lead drawer'
              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          verify_path = Path('scripts/verify-repository-baseline.sh')
          verify = verify_path.read_text(encoding='utf-8')
          verify = re.sub(r'EXPECTED_BYTES="\d+"', f'EXPECTED_BYTES="{new_bytes}"', verify, count=1)
          verify = re.sub(r'EXPECTED_MD5="[0-9a-f]+"', f'EXPECTED_MD5="{new_md5}"', verify, count=1)
          verify = re.sub(r"assert m\['repository_bytes'\]==\d+", f"assert m['repository_bytes']=={new_bytes}", verify, count=1)
          verify = re.sub(r"assert m\['repository_md5'\]=='[0-9a-f]+'", f"assert m['repository_md5']=='{new_md5}'", verify, count=1)
          verify = re.sub(r'echo "Repository source verified: \d+ bytes / [0-9a-f]+"', f'echo "Repository source verified: {new_bytes} bytes / {new_md5}"', verify, count=1)
          verify_path.write_text(verify, encoding='utf-8')

          print(f'Patched index.html: {new_bytes} bytes / {new_md5}')
          PY

          git diff --check
          grep -q 'lm-lead-quick-status-v1' index.html
          grep -q "method:'lead_drawer_dropdown'" index.html
          grep -q "const STATUSES=\['NY','UNDER VURDERING','KLAR TIL KONTAKT','I GANG','DIALOG','MØDE','TILBUD','AFVENTER','PÅ PAUSE','VUNDET','TABT','IKKE RELEVANT'\]" index.html
          bash scripts/verify-repository-baseline.sh

      - name: Commit verified change
        run: |
          rm -f .github/workflows/apply-quick-lead-status.yml
          git config user.name "lead-manager-ui-bot"
          git config user.email "js@klimaeksperten.dk"
          git add index.html baseline/manifest.json scripts/verify-repository-baseline.sh .github/workflows/apply-quick-lead-status.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "feat: add quick lead status dropdown"
          git push origin HEAD:main
